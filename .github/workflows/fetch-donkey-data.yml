name: Temporary validate donkey lectures

on:
  push:
    branches:
      - work/week11-12-lecture-alignment
    paths:
      - .github/workflows/fetch-donkey-data.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            tidyverse
            broom
            knitr
            ggplot2
            patchwork
            fontawesome


      - name: Verify donkey data
        run: |
          Rscript -e 'd <- read.csv("data/donkey.csv"); stopifnot(nrow(d) == 385, all(c("Sex","Age","Bodywt","Heartgirth","Umbgirth","Length","Height") %in% names(d)))'

      - name: Render Week 10 and Week 11
        run: |
          quarto render lectures/10_linear_models.qmd
          quarto render lectures/11_linear_models_hypoth_pred.qmd
