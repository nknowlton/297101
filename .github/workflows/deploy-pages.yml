name: Build & Deploy Course Materials

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          packages: |
            tidyverse
            broom
            knitr
            ggplot2
            patchwork
            shape
            visreg
            fontawesome
            performance
            see
            svglite

      - name: Remove auto-installed Quarto
        run: |
          if dpkg -s quarto >/dev/null 2>&1; then
            sudo apt-get remove -y quarto
          fi

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.14

      - name: Render lecture slides
        run: |
          quarto render lectures/09_slr_01_fitting.qmd
          quarto render lectures/09_slr_02_inference.qmd
          quarto render lectures/09_slr_03_diagnostics.qmd
          quarto render lectures/10_mlr.qmd
          quarto render lectures/11_factors.qmd

      - name: Render workshops and solutions
        run: |
          quarto render labs/Workshop_Week09_SLR.qmd
          quarto render labs/Workshop_Week09_SLR_guide.qmd
          quarto render labs/Workshop_Week10_MLR.qmd
          quarto render labs/Workshop_Week10_MLR_guide.qmd
          quarto render labs/Workshop_Week11_Factors.qmd
          quarto render labs/Workshop_Week11_Factors_guide.qmd

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/lectures _site/labs

          cp site/index.html _site/index.html
          cp site/lectures/index.html _site/lectures/index.html
          cp site/labs/index.html _site/labs/index.html

          cp lectures/09_slr_01_fitting.html _site/lectures/
          cp lectures/09_slr_02_inference.html _site/lectures/
          cp lectures/09_slr_03_diagnostics.html _site/lectures/
          cp lectures/10_mlr.html _site/lectures/
          cp lectures/11_factors.html _site/lectures/

          cp labs/Workshop_Week09_SLR.html _site/labs/
          cp labs/Workshop_Week09_SLR_guide.html _site/labs/
          cp labs/Workshop_Week10_MLR.html _site/labs/
          cp labs/Workshop_Week10_MLR_guide.html _site/labs/
          cp labs/Workshop_Week11_Factors.html _site/labs/
          cp labs/Workshop_Week11_Factors_guide.html _site/labs/

          cp labs/Workshop_Week09_SLR.qmd _site/labs/
          cp labs/Workshop_Week09_SLR_guide.qmd _site/labs/
          cp labs/Workshop_Week10_MLR.qmd _site/labs/
          cp labs/Workshop_Week10_MLR_guide.qmd _site/labs/
          cp labs/Workshop_Week11_Factors.qmd _site/labs/
          cp labs/Workshop_Week11_Factors_guide.qmd _site/labs/
          cp labs/nz_vehicles_2025.csv _site/labs/
          cp labs/coffee_tasting_example.csv _site/labs/
          cp labs/coffee_tasting_balanced.csv _site/labs/
          mkdir -p _site/labs/regression
          cp labs/regression/cancer_data.csv _site/labs/regression/
          cp labs/sensor_calibration_2026.csv _site/labs/
          cp labs/auckland_rentals_2026.csv _site/labs/

      - name: Verify Pages artifact
        run: |
          required=(
            _site/index.html
            _site/lectures/index.html
            _site/lectures/09_slr_01_fitting.html
            _site/lectures/09_slr_02_inference.html
            _site/lectures/09_slr_03_diagnostics.html
            _site/lectures/10_mlr.html
            _site/lectures/11_factors.html
            _site/labs/index.html
            _site/labs/Workshop_Week09_SLR.html
            _site/labs/Workshop_Week09_SLR_guide.html
            _site/labs/Workshop_Week11_Factors.html
            _site/labs/Workshop_Week11_Factors_guide.html
            _site/labs/Workshop_Week10_MLR.html
            _site/labs/Workshop_Week10_MLR_guide.html
            _site/labs/Workshop_Week09_SLR.qmd
            _site/labs/Workshop_Week09_SLR_guide.qmd
            _site/labs/Workshop_Week11_Factors.qmd
            _site/labs/Workshop_Week11_Factors_guide.qmd
            _site/labs/Workshop_Week10_MLR.qmd
            _site/labs/Workshop_Week10_MLR_guide.qmd
            _site/labs/nz_vehicles_2025.csv
            _site/labs/regression/cancer_data.csv
            _site/labs/coffee_tasting_example.csv
            _site/labs/coffee_tasting_balanced.csv
            _site/labs/sensor_calibration_2026.csv
            _site/labs/auckland_rentals_2026.csv
          )
          for file in "${required[@]}"; do
            test -f "$file"
          done

          grep -q 'View the worked solutions online' _site/labs/Workshop_Week09_SLR.html
          grep -q 'View the worked solutions online' _site/labs/Workshop_Week11_Factors.html
          grep -q 'View the worked solutions online' _site/labs/Workshop_Week10_MLR.html

      - name: Generate sitemap
        run: python3 scripts/generate_sitemap.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
